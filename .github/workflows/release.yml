name: Packslip

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Package plugin
        id: package
        shell: bash
        run: |
          set -euo pipefail
          version=$(sed -n 's/^PLUGIN.version = "\([^"]*\)"/\1/p' metadata.lua)
          test -n "$version"
          if [[ "$GITHUB_REF_TYPE" == tag ]]; then
            test "$GITHUB_REF_NAME" = "v$version"
            tag="$GITHUB_REF_NAME"
          else
            version="$version-dev.$GITHUB_RUN_NUMBER"
            tag="v$version"
          fi
          mkdir -p dist
          git archive --format=tar HEAD metadata.lua hooks lib LICENSE | gzip -n > dist/vfox-bfs.tar.gz
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
      - name: Sign packslip
        uses: jdx/packslip@ddcddd9c8c33977d2d08d5db91caec579da59aab # v1.11.0
        with:
          artifacts: dist/vfox-bfs.tar.gz
          manifest: packslip.toml
          version: ${{ steps.package.outputs.version }}
          tag: ${{ steps.package.outputs.tag }}
          out: dist
          upload: "false"
      - name: Verify archive and signer
        run: |
          packslip verify dist/packslip.sigstore.json \
            --artifact dist/vfox-bfs.tar.gz \
            --identity-prefix "https://github.com/${GITHUB_REPOSITORY}/.github/workflows/release.yml@" \
            --issuer https://token.actions.githubusercontent.com
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: plugin-release
          path: dist/
          if-no-files-found: error

  test:
    needs: package
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: plugin-release
          path: dist
      - uses: jdx/mise-action@8418fedb1110381a0d3ba51a7a415d7c1b884550 # v5
        with:
          install: false
      - name: Verify and exercise released plugin
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          mise x packslip@1.1.1 -- packslip verify dist/packslip.sigstore.json \
            --artifact dist/vfox-bfs.tar.gz \
            --identity-prefix "https://github.com/${GITHUB_REPOSITORY}/.github/workflows/release.yml@" \
            --issuer https://token.actions.githubusercontent.com
          mkdir plugin
          tar -xzf dist/vfox-bfs.tar.gz -C plugin
          test -f plugin/metadata.lua
          test ! -e plugin/.git
          mise plugins link bfs "$PWD/plugin"
          mise x bfs@4.0.4 -- bfs --version

  publish:
    if: github.ref_type == 'tag'
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: plugin-release
          path: dist
      - name: Publish verified plugin release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --verify-tag --generate-notes
          fi
          gh release upload "$GITHUB_REF_NAME" dist/vfox-bfs.tar.gz dist/packslip.sigstore.json \
            --repo "$GITHUB_REPOSITORY"
